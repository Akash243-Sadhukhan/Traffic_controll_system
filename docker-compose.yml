# docker-compose.yml  (project root — /Users/akash/Desktop/minor/docker-compose.yml)
# Full compose file: existing services updated + simulation/mongodb added.

services:

  # ── SUMO traffic simulation (new) ─────────────────────────────────────────
  simulation:
    build:
      context: ./Sumo_simulation/scripts
      dockerfile: Dockerfile          # create this if you want Docker support
    depends_on:
      - ai-services
    environment:
      - AI_SERVICE_URL=http://ai-services:8001
    volumes:
      - ./Sumo_simulation/scripts/generated:/app/generated

  # ── AI / ML services (updated: port 8001, depends on backend) ───────────
  ai-services:
    build: ./ai-services
    ports:
      - "8001:8001"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
      - SHOW_WINDOW=0
      - YOLO_CONFIG_DIR=/app/.ultralytics
    volumes:
      - ./ai-services/Data:/app/Data:ro
      - ./ai-services/models:/app/models

  # ── Spring Boot backend (updated: service name 'backend', mongo URI) ─────
  backend:
    build: ./backend-services
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/traffic
    restart: always

  # ── MongoDB (new) ─────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: