version: '3.8'
services:
  backend-service:
    build: ./backend-services
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb+srv://akash:password@cluster.mongodb.net/traffic_db
    restart: always

  ai-service:
    build: ./ai-services
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend-service:8080
    depends_on:
      - backend-service